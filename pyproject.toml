# Configure the locked Python evidence-tool package, lint rules, and test discovery.
[project]
name = "rexp-studio-tools"
version = "0.1.0"
description = "Offline evidence and validation tools used by REXP Studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1",
    "PyMuPDF>=1.27,<2",
]

[tool.uv]
required-version = "==0.10.7"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.pylint.similarities]
min-similarity-lines = 12

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.14.14",
]

[tool.ruff.lint.per-file-ignores]
"tools/_build_relution_import_artifacts_modules/*.py" = ["F401", "F403", "F405", "F821"]
"tools/_harvest_bsi_grundschutz_modules/*.py" = ["F401", "F403", "F405", "F821"]
"tools/_recommendation_mapping_modules/*.py" = ["F401", "F403", "F405", "F821"]
"tools/build_relution_import_artifacts.py" = ["E402", "F403", "F405", "F821"]
"tools/harvest_bsi_grundschutz.py" = ["E402", "F403", "F405", "F821"]
"tools/recommendation_mapping.py" = ["E402", "F403", "F405", "F821"]
