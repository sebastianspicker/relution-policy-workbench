name: Relution Docker E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  relution-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker Relution E2E
        timeout-minutes: 20
        run: pnpm test:e2e:relution

      - name: Capture Docker logs
        if: always()
        run: |
          docker compose -p relution-policy-workbench-e2e -f docker-compose.relution-e2e.yml logs --no-color > relution-e2e.log || true

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relution-e2e-logs
          path: relution-e2e.log
          if-no-files-found: ignore
